
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASIQA - الموسيقى</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#100b19;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:linear-gradient(120deg,#8b35ff,#390c70);
 padding:25px;
 text-align:center;
}
.logo{font-size:42px}
h1{margin:8px}
header p{color:#ead9ff}
.container{padding:18px;max-width:900px;margin:auto}
.search{
 display:flex;gap:8px;margin:20px 0;
}
input{
 flex:1;padding:14px;border:0;border-radius:12px;
 background:#261a35;color:white;font-size:16px;
 min-width:0;
}
button{
 border:0;border-radius:10px;padding:12px;
 background:#913cff;color:white;font-weight:bold;
 cursor:pointer;
}
.categories{
 display:flex;gap:8px;overflow-x:auto;padding:10px 0;
}
.categories button{white-space:nowrap}
.song{
 background:#21172e;padding:12px;margin:10px 0;
 border-radius:14px;display:flex;align-items:center;gap:12px;
}
.cover{
 width:58px;height:58px;border-radius:10px;
 background:linear-gradient(140deg,#a34cff,#24004e);
 display:grid;place-items:center;font-size:27px;flex-shrink:0;
}
.info{flex:1;min-width:0}
.info h3{margin:4px 0}
.info p{margin:4px 0;color:#bca9d2;font-size:13px}
.song button{margin:2px}
.player{
 position:sticky;bottom:0;background:#261438;
 padding:15px;text-align:center;border-top:2px solid #873aff;
}
#now{margin:8px;font-weight:bold}
.controls{display:flex;justify-content:center;gap:12px}
.controls button{font-size:18px}
audio{width:100%;height:35px;margin-top:10px}
small{color:#c9b4df}
</style>
</head>

<body>

<header>
 <div class="logo">🎵</div>
 <h1>MASIQA</h1>
 <p>عالم الموسيقى بين يديك</p>
</header>

<div class="container">

<h2>🔍 ابحث عن أغنيتك</h2>

<div class="search">
 <input id="search" placeholder="اسم الأغنية أو الفنان...">
 <button onclick="searchMusic()">بحث</button>
</div>

<div class="categories">
 <button onclick="choose('Raï')">🎤 راي</button>
 <button onclick="choose('Rap')">🔥 راب</button>
 <button onclick="choose('Arabic')">🌙 عربي</button>
 <button onclick="choose('Chaabi')">🎻 شعبي</button>
 <button onclick="choose('Pop')">🌍 أجنبي</button>
</div>

<h2 id="heading">🎧 الأغاني</h2>
<div id="songs">ابحث عن أغانيك المفضلة...</div>

<h2>❤️ المفضلة</h2>
<div id="favorites"></div>

</div>

<div class="player">
 <div id="now">🎵 اختر أغنية للاستماع</div>
 <div class="controls">
  <button onclick="previous()">⏮</button>
  <button onclick="togglePlay()">▶️ / ⏸</button>
  <button onclick="next()">⏭</button>
 </div>
 <audio id="audio" controls></audio>
 <small>MASIQA • مشغل الموسيقى الداخلي</small>
</div>

<script>
let tracks=[];
let current=-1;
let favorites=JSON.parse(localStorage.getItem("masiqaFav")||"[]");

const audio=document.getElementById("audio");

async function searchMusic(){
 const term=document.getElementById("search").value.trim();
 if(!term)return;

 document.getElementById("heading").textContent="نتائج البحث";
 document.getElementById("songs").textContent="جاري البحث...";

 try{
  const url="https://itunes.apple.com/search?term="
   +encodeURIComponent(term)+"&entity=song&limit=40";

  const response=await fetch(url);
  const data=await response.json();

  tracks=data.results.filter(x=>x.previewUrl);
  showSongs(tracks,"songs");
 }catch(e){
  document.getElementById("songs").textContent=
   "تعذر الاتصال بالإنترنت. حاول مرة أخرى.";
 }
}

function choose(category){
 document.getElementById("search").value=category;
 searchMusic();
}

function showSongs(list,element){
 const area=document.getElementById(element);
 area.innerHTML="";

 if(!list.length){
  area.textContent="لم نجد أغاني متاحة.";
  return;
 }

 list.forEach((song,index)=>{
  const div=document.createElement("div");
  div.className="song";

  const cover=document.createElement("img");
  cover.className="cover";
  cover.src=song.artworkUrl100;
  cover.alt="غلاف الأغنية";

  const info=document.createElement("div");
  info.className="info";

  const name=document.createElement("h3");
  name.textContent=song.trackName;

  const artist=document.createElement("p");
  artist.textContent=song.artistName;

  info.append(name,artist);

  const play=document.createElement("button");
  play.textContent="▶";
  play.onclick=()=>playTrack(song);

  const fav=document.createElement("button");
  fav.textContent="❤️";
  fav.onclick=()=>saveFavorite(song);

  div.append(cover,info,play,fav);
  area.appendChild(div);
 });
}

function playTrack(song){
 current=tracks.indexOf(song);
 audio.src=song.previewUrl;
 document.getElementById("now").textContent=
 song.trackName+" - "+song.artistName;
 audio.play();
}

function togglePlay(){
 if(!audio.src){
  if(tracks.length)playTrack(tracks[0]);
  return;
 }
 if(audio.paused)audio.play();
 else audio.pause();
}

function next(){
 if(!tracks.length)return;
 current=(current+1)%tracks.length;
 playTrack(tracks[current]);
}

function previous(){
 if(!tracks.length)return;
 current=(current-1+tracks.length)%tracks.length;
 playTrack(tracks[current]);
}

function saveFavorite(song){
 if(favorites.some(x=>x.trackId===song.trackId))return;
 favorites.push({
  trackId:song.trackId,
  trackName:song.trackName,
  artistName:song.artistName,
  artworkUrl100:song.artworkUrl100,
  previewUrl:song.previewUrl
 });
 localStorage.setItem("masiqaFav",JSON.stringify(favorites));
 showSongs(favorites,"favorites");
}

showSongs(favorites,"favorites");

document.getElementById("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchMusic();
});
</script>

</body>
</html>
